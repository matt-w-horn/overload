        Filter.Tendsto (fun n => P.a n / ↑n) Filter.atTop (nhds τ) →
          Filter.Tendsto (fun n => P.sojournSum n / ↑n) Filter.atTop (nhds Wbar) →
            Filter.Tendsto (fun n => P.valueSum g n / ↑n) Filter.atTop (nhds Gbar) →
              Filter.Tendsto (fun t => P.valueArea g t / t) Filter.atTop (nhds (Gbar / τ))

